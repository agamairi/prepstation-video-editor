name: fluxedit
description: Production-grade Flutter video editor — Android, iOS, macOS.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # FFmpeg — full GPL build for maximum codec/filter support
  ffmpeg_kit_flutter_full_gpl: ^6.0.3

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^15.1.2

  # Persistence
  drift: ^2.24.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.4+1

  # Preferences / metadata cache
  hive_ce: ^2.10.1
  hive_ce_flutter: ^2.2.0

  # File / media access
  path_provider: ^2.1.5
  file_picker: ^8.3.7
  image_picker: ^1.1.2

  # Playback
  video_player: ^2.9.5
  just_audio: ^0.9.45

  # Math
  vector_math: ^2.1.4

  # Charts (waveform)
  fl_chart: ^0.70.2

  # Image processing (thumbnails)
  image: ^4.3.0

  # UUID generation
  uuid: ^4.5.3

  # UI extras
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.0
  riverpod_generator: ^2.6.5
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/shaders/
    - assets/luts/
    - assets/fonts/
